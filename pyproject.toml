[project]
name = "simkit-demo"
version = "0.1.0"
description = "Async pipeline demo for battery TEA"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "numpy>=1.23",
  "pandas>=1.5",
  "pyarrow>=12",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["simkit"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
