# Demo linear pipeline contract; extend modules/edges when new pipeline steps are introduced.
metadata:
  run_description: Demo linear pipeline for regression coverage
  output_folder: pipeline_result_bundle
modules:
  entry_point:
    module_type: EntryPoint
    inputs:
      geo: Geography ../geography_us_ca_pge.json
      load_profile: LoadProfile8760 ../load_profile_toy_8760.parquet
      financial_params: FinancialParams ../financial_params_demo.json
  rate_data:
    module_type: RateData
    inputs:
      geography: Geography geo
    outputs:
      root: RootModel[RateInfo] rate_info
  configure_battery:
    module_type: ConfigureBattery
    inputs:
      load_profile: LoadProfile8760 load_profile
      rate_info: RateInfo rate_info.root
      design_prefs: None -> design_pref_default
    outputs:
      root: RootModel[BatteryConfig] battery_config
  simple_performance_sim:
    module_type: SimplePerformanceSim
    inputs:
      battery: BatteryConfig battery_config.root
      load_profile: LoadProfile8760 load_profile
      pv_profile: None -> pv_profile_default
      rate_info: RateInfo rate_info.root
    outputs:
      root: RootModel[BatteryTelemetry8760] telemetry
  cost_calculator:
    module_type: CostCalculator
    inputs:
      config: BatteryConfig battery_config.root
      geography: Geography geo
    outputs:
      root: RootModel[CostBreakdown] cost_breakdown
  project_analyzer:
    module_type: ProjectAnalyzer
    inputs:
      rate_info: RateInfo rate_info.root
      telemetry: BatteryTelemetry8760 telemetry.root
      financial_params: FinancialParams financial_params
      cost_breakdown: CostBreakdown cost_breakdown.root
    outputs:
      root: RootModel[FinancialResults] financial_results
  exit_point:
    module_type: ExitPoint
    outputs:
      rate_info: RateInfo rate_info.root.json
      battery_config: BatteryConfig battery_config.root.json
      cost_breakdown: CostBreakdown cost_breakdown.root.json
      telemetry: BatteryTelemetry8760 telemetry.root.parquet
      financial_results: FinancialResults financial_results.root.json
